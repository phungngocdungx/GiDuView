[package]
name = "giduview"
version = "1.0.0"
edition = "2021"
description = "Native macOS Remote Desktop Client & Host compatible with UltraViewer"
license = "MIT"
default-run = "giduview"

[lib]
name = "giduview"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "giduview"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
aes = "0.8"
getrandom = "0.3"
jpeg-decoder = { version = "0.3", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
zstd-safe = { version = "7", features = ["experimental", "std"] }
png = "0.17"
unicode-normalization = "0.1"
arboard = "3"
cpal = { version = "0.15", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS native ScreenCaptureKit, CoreGraphics, ApplicationServices are linked via framework attributes

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
